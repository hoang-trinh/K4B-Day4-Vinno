# starter_v0 — intentionally incomplete first-draft declarations.
# Students improve routing guidance, argument conventions, missing-information
# handling, and confirmation boundaries through v1/v2/v3.
#
# Keep built-in names and supplied evaluation cases unchanged.
# Improve descriptions and compatible schemas. Declare team-built bonus tools
# here and in tools/__init__.py, then test them with team-authored cases.
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Hỏi lại người dùng khi thiếu thông tin quan trọng (như thiếu mã asset_id của máy, thiếu employee_id cụ thể, môi trường chưa rõ ràng giữa production/staging) hoặc khi cần người dùng xác nhận (yes_no) trước một hành động ghi dữ liệu/tạo ticket hoặc thao tác nguy hiểm."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi cần hỏi lại hoặc câu hỏi xác nhận"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu trả lời: 'text' khi thiếu thông tin; 'yes_no' khi cần hỏi xác nhận trước khi thực hiện hành động ghi/tạo ticket; 'choice' khi cần chọn giữa các phương án"}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn cụ thể nếu response_type là choice, ví dụ ['production', 'staging']"}
      required: [question]

  - name: search_kb
    description: "Tìm bài viết hướng dẫn xử lý sự cố kỹ thuật trong Knowledge Base (hướng dẫn cấu hình Outlook/VPN/Wifi, xử lý máy in, driver, mã lỗi). Không dùng cho tra cứu trạng thái dịch vụ thời gian thực hay chính sách công ty."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Nội dung cần tìm"}
        category: {type: string, enum: [all, vpn, email, wifi, printing, account, security, hardware, software, meeting_room], default: "all", description: "Nhóm hướng dẫn"}
        top_k: {type: integer, default: 3, description: "Số kết quả"}
      required: [query]

  - name: check_service_status
    description: "Kiểm tra trạng thái vận hành của dịch vụ dùng chung (VPN, Email, SSO, Wifi, Printing). Phải chọn đúng environment: production hoặc staging (không tự ý đổi staging thành production)."
    parameters:
      type: object
      properties:
        service: {type: string, enum: [vpn, email, sso, wifi, printing], description: "Tên dịch vụ"}
        environment: {type: string, enum: [production, staging], default: "production", description: "Môi trường: production hoặc staging"}
      required: [service]

  - name: inspect_device
    description: "Kiểm tra thông tin chi tiết và chẩn đoán phần cứng/phần mềm của một thiết bị cụ thể qua asset_id (ví dụ LT-204, DT-031). Khi người dùng hỏi về lỗi VPN, phải đặt check='vpn'. Khi hỏi về kết nối wifi/mạng nói chung, đặt check='network'. Chỉ dùng check='all' khi người dùng yêu cầu kiểm tra tổng thể."
    parameters:
      type: object
      properties:
        asset_id: {type: string, description: "Mã tài sản thiết bị cụ thể (ví dụ LT-204, DT-031). Tuyệt đối không truyền chuỗi chung chung như 'laptop'."}
        check: {type: string, enum: [all, network, vpn, security, hardware, software], default: "all", description: "Hạng mục kiểm tra: 'vpn' nếu kiểm tra VPN máy; 'network' nếu kiểm tra wifi/mạng; 'hardware' nếu kiểm tra phần cứng; 'security' nếu kiểm tra bảo mật; 'all' nếu kiểm tra tổng thể."}
      required: [asset_id]

  - name: lookup_user
    description: "Tra cứu thông tin tài khoản và thiết bị được cấp của nhân viên qua mã nhân viên (employee_id dạng EMP-xxxx). Chỉ gọi công cụ này khi tra cứu nhân viên; không gọi kèm inspect_device trừ khi người dùng yêu cầu kiểm tra cụ thể một thiết bị riêng biệt."
    parameters:
      type: object
      properties:
        employee_id: {type: string, description: "Mã nhân viên cụ thể (ví dụ EMP-1003). Không truyền tên phòng ban hay chức danh."}
      required: [employee_id]

  - name: format_incident_report
    description: "Trình bày các kết quả đã có thành báo cáo."
    parameters:
      type: object
      properties:
        findings:
          type: array
          default: []
          description: "Các kết quả đã thu thập"
          items:
            type: object
            properties:
              label: {type: string}
              detail: {type: string}
              source: {type: string}
              status: {type: string}
        template: {type: string, enum: [brief, technical, handoff], default: "brief", description: "Mẫu báo cáo"}
        incident_title: {type: string, default: "IT incident", description: "Tiêu đề"}
      required: [findings, template]

  # ---------------- Optional/advanced tools ----------------
  - name: search_device_info
    description: "Tìm thông tin công khai về một model thiết bị trên web. Chỉ truyền hãng, model và loại thông tin; không truyền asset ID, employee ID hoặc dữ liệu nội bộ."
    parameters:
      type: object
      properties:
        manufacturer: {type: string, description: "Hãng sản xuất công khai, ví dụ Lenovo"}
        model: {type: string, description: "Tên model công khai, ví dụ ThinkPad T14 Gen 4"}
        query_type: {type: string, enum: [specs, drivers, support, compatibility], default: "support", description: "Loại thông tin cần tìm"}
        max_results: {type: integer, default: 3, description: "Số kết quả, tối đa 5"}
      required: [manufacturer, model, query_type]

  - name: policy
    description: "Tìm trong chính sách IT nội bộ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Nội dung cần tìm"}
        policy_area: {type: string, enum: [all, access_control, data_privacy, external_tools, incident_response, service_operations, ticketing], default: "all", description: "Nhóm chính sách"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: create_ticket
    description: "Tạo một ticket hỗ trợ."
    parameters:
      type: object
      properties:
        summary: {type: string, default: "", description: "Tóm tắt sự cố"}
        priority: {type: string, enum: [low, medium, high, critical], default: "medium", description: "Mức ưu tiên"}
        asset_id: {type: string, default: "", description: "Mã tài sản nếu có"}
        confirmed: {type: boolean, default: false, description: "Đã được người dùng xác nhận"}
      required: [summary]
